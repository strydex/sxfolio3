  <!-- Tech accents -->
  <line x1="20" y1="12" x2="35" y2="12" stroke="#defe47" stroke-width="2"/>
  <line x1="65" y1="88" x2="80" y2="88" stroke="#defe47" stroke-width="2"/>
  <line x1="8" y1="50" x2="18" y2="50" stroke="#05d9e8" stroke-width="2"/>
  <line x1="82" y1="50" x2="92" y2="50" stroke="#05d9e8" stroke-width="2"/>

